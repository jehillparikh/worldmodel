bookdown::gitbook:
  css: style.css
  includes:
    in_header: null
    before_body: null
    after_body: null
  config:
    toc:
      collapse: subsection
      scroll_highlight: yes
      before: |
        <li><a href="./" style="font-weight: 700; font-size: 1.1em; padding: 10px 15px; display: block; border-bottom: 1px solid #e1e4e8;">Foundations of World Models</a></li>
      after: null
    toolbar:
      position: fixed
    edit: null
    download: null
    search:
      engine: lunr
      options: null
    sharing: null
    fontsettings:
      theme: white
      family: serif
      size: 2
    info: no

bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
  toc_depth: 3
  toc_unnumbered: yes
  toc_appendix: yes
  pandoc_args: ["--top-level-division=chapter"]

bookdown::epub_book:
  stylesheet: style.css
  toc_depth: 2
  cover_image: Images/worldmodel.png
